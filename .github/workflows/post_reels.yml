name: Auto Post Science Fact and Joke

on:
  schedule:
    - cron: '0 6,16 * * *'
  workflow_dispatch:

jobs:
  post-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Post to Facebook
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: |
          python -c "
          import os
          import json
          import urllib.request
          import urllib.parse

          api_key = os.environ['GEMINI_API_KEY']
          page_access_token = os.environ['PAGE_ACCESS_TOKEN']
          page_id = '1142879355574849'

          # Gemini API සඳහා නිවැරදි URL එක සකස් කිරීම
          url = f'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}'
          
          headers = {'Content-Type': 'application/json'}
          data = {
              'contents': {
                  'parts': [{'text': 'Create a combined social media post in English. Part 1: A short, engaging, and amazing science fact. Part 2: A clean and funny science-related joke. Add emojis and relevant hashtags.'}]
              }
          }
          
          req = urllib.request.Request(url, data=json.dumps(data).encode('utf-8'), headers=headers, method='POST')
          
          try:
              with urllib.request.urlopen(req) as response:
                  res_data = json.loads(response.read().decode('utf-8'))
                  content = res_data['candidates'][0]['content']['parts'][0]['text']
          except Exception as e:
              content = 'Failed to generate content via API'

          post_text = f'🔬 *Daily Science & Fun* 🔬\n\n{content}'

          # Facebook Graph API සඳහා message එක Encoding කිරීම
          msg_encoded = urllib.parse.urlencode({'message': post_text, 'access_token': page_access_token})
          fb_url = f'https://graph.facebook.com/v20.0/{page_id}/feed?{msg_encoded}'
          
          fb_req = urllib.request.Request(fb_url, method='POST')
          try:
              with urllib.request.urlopen(fb_req) as fb_response:
                  print('Post Success:', fb_response.read().decode('utf-8'))
          except Exception as fb_err:
              print('Facebook Post Error:', fb_err)
          "

name: Auto Post Science Fact and Joke

on:
  schedule:
    - cron: '0 6,16 * * *'
  workflow_dispatch:

jobs:
  post-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-generativeai

      - name: Test Gemini API Generation
        run: |
          python -c "
          import google.generativeai as genai

          GEMINI_API_KEY = 'AIzaSyDUu9OAYmzPAVrg3PX55nWuZ87hmvy3Y6A'
          genai.configure(api_key=GEMINI_API_KEY)
          
          # gemini-1.5-flash වෙනුවට gemini-1.5-pro භාවිතා කිරීම
          model = genai.GenerativeModel('gemini-1.5-pro')

          prompt = 'Create a combined social media post in English. Part 1: A short, engaging, and amazing science fact. Part 2: A clean and funny science-related joke. Add emojis and relevant hashtags.'
          
          response = model.generate_content(prompt)
          print('--- GENERATED CONTENT ---')
          print(response.text)
          print('-------------------------')
          "

name: Auto Post Science Fact and Joke

on:
  schedule:
    - cron: '0 6,16 * * *'
  workflow_dispatch:

jobs:
  post-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Create Python Script
        run: |
          cat << 'EOF' > post_to_fb.py
          import os
          import urllib.request
          import urllib.parse
          
          page_id = '1142879355574849'
          token = os.environ.get('PAGE_ACCESS_TOKEN')
          
          post_text = (
              "🔬 🌟 Daily Science & Fun 🌟 🔬\n\n"
              "Did you know? Bananas are curved because they grow towards the sun against gravity, "
              "a process known as negative geotropism. 🍌\n\n"
              "Joke: Why can't you trust atoms? Because they make up everything! 😂\n\n"
              "#ScienceFacts #Funny #ScienceJoke"
          )
          
          query_params = urllib.parse.urlencode({'message': post_text, 'access_token': token})
          fb_url = f'https://graph.facebook.com/v21.0/{page_id}/feed?{query_params}'
          
          req = urllib.request.Request(fb_url, method='POST')
          
          try:
              with urllib.request.urlopen(req) as response:
                  res = response.read().decode('utf-8')
                  print('Success:', res)
          except urllib.error.HTTPError as e:
              print(f'HTTP Error {e.code}: {e.reason}')
              print('Raw Response:', e.read().decode('utf-8'))
          except Exception as e:
              print('Unexpected Error:', e)
          EOF

      - name: Run Post Script
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: python post_to_fb.py

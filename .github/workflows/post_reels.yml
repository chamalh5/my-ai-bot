name: Auto Post Reels

on:
  schedule:
    # දිනපතා උදේ 6.00 සහ සවස 4.00 ට ක්‍රියාත්මක වන පරිදි (විනාඩි 0, පැය 6 සහ 16)
    - cron: '0 6,16 * * *'
  workflow_dispatch: # Manual එකක් Run කිරීමට

jobs:
  post-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests google-generativeai

      - name: Run Script
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
        run: |
          python -c '
          import os
          import requests
          import google.generativeai as genai

          # API Key එක මෙහි ඇතුළත් කරන්න
          GEMINI_API_KEY = "AIzaSyDUu9OAYmzPAVrg3PX55nWuZ87hmvy3Y6A"
          PAGE_ID = "1142879355574849"

          genai.configure(api_key=GEMINI_API_KEY)
          model = genai.GenerativeModel("gemini-1.5-flash")

          # Gemini API එකෙන් අන්තර්ගතය ලබා ගැනීම
          response = model.generate_content("Create a short, engaging Facebook Reel caption about motivation in Sinhala.")
          caption = response.text

          # Facebook Graph API එකට යැවීම
          url = f"https://graph.facebook.com/v20.0/{PAGE_ID}/feed"
          payload = {
              "message": caption,
              "access_token": os.environ["PAGE_ACCESS_TOKEN"]
          }

          r = requests.post(url, data=payload)
          print(r.json())
          '
